<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p7 - grid flex</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Michroma&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        :root {
            --lime-color: #CCFF02;
            --storm-color: #8695A8;
            --violet-color: #E4D2FC;
            --chilli-color: #EF432B;
            --dark-color: #282725;
            --light-color: #EFEAE7;
            --forest-color: #325444;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-size: 16px;
        }
        .container {
            display: grid;
            grid-template-columns: 3fr 3fr 2fr;
            grid-template-rows: repeat(4, 1fr);
            height: 100vh;
        }
        .lime, .storm, .violet, .chilli, .dark, .light, .forest {
            padding: 1.5vw;
        }
        .lime {
            background-color: var(--lime-color);
            grid-column: 1/2;
            color: var(--forest-color);
        }
        .storm {
            background-color: var(--storm-color);
            grid-column: 1/2;
            grid-row: 2/3;
            color: var(--light-color);
        }
        .violet {
            background-color: var(--violet-color);
            grid-column: 1/2;
            grid-row: 3/4;
            color: var(--chilli-color);
        }
        .chilli {
            background-color: var(--chilli-color);
            grid-column: 1/2;
            grid-row: 4/5;
            color: var(--light-color);
        }
        .central {
            grid-column: 2/3;
            grid-row: 1/5;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .dark {
            height: 37.5%;
            background-color: var(--dark-color);
            color: var(--light-color);
        }
        .light {
            height: 62.5%;
            background-color: var(--light-color);
            color: var(--dark-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .forest {
            display: flex;
            justify-content: space-between;
            background-color: var(--forest-color);
            color: var(--light-color);
            grid-column: 3/4;
            grid-row: 1/5;
        }
        .forest h1 {
            writing-mode: vertical-rl;
            order: 2;
        }
        h1 {
            font-family: 'Michroma', sans-serif;
            font-size: 5vw;
        }
        p {
            font-family: 'Poppins', sans-serif;
            font-size: 1vw;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lime">
            <p>#CCFF02</p>
            <h1>LIME</h1>
        </div>
        <div class="storm">
            <p>#8696A8</p>
            <h1>STORM</h1>
        </div>
        <div class="violet">
            <p>#E4D2FC</p>
            <h1>VIOLET</h1>
        </div>
        <div class="chilli">
            <p>#EF432B</p>
            <h1>CHILLI</h1>
        </div>
        <div class="central">
            <div class="dark">
                <p>#282625</p>
                <h1>DARK</h1>
            </div>
            <div class="light">
                <p>#EFEAE8</p>
                <h1>LIGHT&amp;<br>BRIGHT</h1>
            </div>
        </div>
        <div class="forest">
            <p>#325444</p>
            <h1>FOREST</h1>
        </div>
    </div>
</body>
</html>
